name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Build Release APK with Gradle
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dorg.gradle.daemon=false"
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          else
            gradle assembleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          fi

      - name: Generate Release Keystore and Sign APK
        run: |
          # Generar keystore formal de Release (RSA 2048, 10000 dias validez)
          keytool -genkeypair -v -keystore release.keystore \
            -alias cinewidget \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "cinewidget123" -keypass "cinewidget123" \
            -dname "CN=Cine Widget, OU=Mobile, O=CineWidget, L=Barranquilla, ST=Atlantico, C=CO"

          # Firmar APK con apksigner (v1, v2, v3 schemes)
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias cinewidget \
            --ks-pass pass:cinewidget123 \
            --key-pass pass:cinewidget123 \
            --out cine-widget.apk \
            "$UNSIGNED_APK"

          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose cine-widget.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cine-widget-apk
          path: cine-widget.apk
          retention-days: 7

      - name: Publish Direct APK to GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git tag -d latest 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest cine-widget.apk \
            --title "Cine Widget App (Latest Signed APK)" \
            --notes "Descarga directa de **cine-widget.apk** firmado formalmente para Android. Instálalo directamente en tu teléfono." \
            --latest
